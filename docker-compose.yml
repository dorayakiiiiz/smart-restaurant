version: '3.8'

services:
  # Backend Service
  backend:
    build: ./smart-restaurant-be
    container_name: smart-restaurant-backend
    ports:
      - "5000:5000"
    environment:
      # Chúng ta có thể pass thẳng các biến môi trường vào đây hoặc dùng env_file
      - PORT=5000
    env_file:
      - ./smart-restaurant-be/.env
    restart: always

  # Frontend Service
  frontend:
    build:
      context: ./smart-restaurant-fe
      args:
        # Truyền biến môi trường vào lúc build image (Vite cần tại build time)
        - VITE_API_URL=http://localhost:5000/api
        - VITE_SOCKET_URL=http://localhost:5000
        - VITE_CLIENT_URL=http://localhost:5173
    container_name: smart-restaurant-frontend
    ports:
      - "5173:80" # Map port 5173 của máy host vào port 80 của container Nginx
    depends_on:
      - backend
    restart: always